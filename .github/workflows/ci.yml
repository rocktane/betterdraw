name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size

  e2e:
    name: E2E
    # version fixée : les captures de référence dépendent du système et de ses polices
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lire la version de Playwright
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restaurer les navigateurs
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Installer Chromium et ses dépendances
        if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: bash .github/scripts/with-apt-retry.sh npx playwright install --with-deps chromium
      - name: Installer les dépendances système
        if: steps.browsers.outputs.cache-hit == 'true'
        timeout-minutes: 12
        run: bash .github/scripts/with-apt-retry.sh npx playwright install-deps chromium
      # une PR passe le socle @essentiel ; la merge queue et main passent la suite complète
      - name: Tests E2E
        run: npm run ${{ github.event_name == 'pull_request' && 'test:e2e:essentiel' || 'test:e2e' }}
      - name: Publier le rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore
